[project]
name = "agentic-ai-data-pipeline-workshop"
version = "0.1.0"
description = "Hands-on: Agentic Data Pipelines with MCP and watsonx.data — TechXchange LAB-4145"
requires-python = ">=3.11"
dependencies = [
    # Kafka producer
    "confluent-kafka>=2.3.0",
    # Environment variable management
    "mcp[cli]<2",
    "python-dotenv>=1.0.0",
]

[project.scripts]
producer = "producer.producer:run"
mcp-ingestion-server = "mcp_ingestion_server.server:run"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-env>=1.7.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["producer", "mcp_ingestion_server"]
